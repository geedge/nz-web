# docker镜像
# image: git.mesalab.cn:7443/nezha/nz-build-env:1.3
# 定义全局变量
variables:
  MINIO_HOST: 'http://192.168.44.36:2020/'
  MINIO_USER: 'admin'
  MINIO_PWD: "Nezha@02!"
  MAVEN_REPO: "/etc/maven/repository/"
  MARIADB_DATABASE: "test"
  MARIADB_ROOT_HOST: '%'
  MYSQL_ROOT_PASSWORD: '111111'
# 依赖的docker服务
services:
  - mariadb:10.2.14
# 开始执行脚本前所需执行脚本
before_script:
  - echo "begin ci"
# 脚本执行完后的钩子，执行所需脚本
after_script:
  - echo "end ci"
  - echo $MARIADB_DATABASE
  - echo $MARIADB_ROOT_PASSWORD
# 该ci pipeline适合的场景
stages:
  - build
  - test
# maven setting /usr/share/maven/conf/settings.xml
cache:
  paths:
    - $MAVEN_REPO


# 定义的任务
dev_build2:
  stage: test
  image: mariadb:10.2.14
  # environment:
  #     MARIADB_ROOT_PASSWORD: abc
  # 所需执行的脚本
  script:
    # - env | sort
    # - pwd
    - echo "SELECT 'OK';" 
    - mysql --user=root --password="$MYSQL_ROOT_PASSWORD" --host=$MARIADB_ROOT_HOST "$MARIADB_DATABASE"
  # 在哪个分支上可用
  only:
    - /^dev-.*$/i
  # 指定哪个ci runner跑该工作
  tags:
    - nezha