# docker镜像
# image: git.mesalab.cn:7443/nezha/nz-build-env:1.3
# 定义全局变量
variables:
  MINIO_HOST: 'http://192.168.44.36:2020/'
  MINIO_USER: 'admin'
  MINIO_PWD: "Nezha@02!"
  MAVEN_REPO: "/etc/maven/repository/"
  MYSQL_DATABASE: "test"
  MYSQL_ROOT_PASSWORD: '111111'
# 依赖的docker服务
services:
  - mariadb:10.2.14
  - redis:5.0.14
# 开始执行脚本前所需执行脚本
before_script:
  - echo "begin ci"
# 脚本执行完后的钩子，执行所需脚本
after_script:
  - echo "end ci"
# 该ci pipeline适合的场景
stages:
  - test
# maven setting /usr/share/maven/conf/settings.xml
cache:
  paths:
    - $MAVEN_REPO

# 定义的任务
env_test:
  stage: test
  # image: mariadb:10.2.14
  # # 所需执行的脚本
  # script:
  #   - echo "redis start"
    # - redis-cli -h redis ping
    # - echo "mariadb start" 
    # - mysql --user=root --password="$MYSQL_ROOT_PASSWORD" --host=mariadb "$MYSQL_DATABASE"
  # 在哪个分支上可用
  only:
    - /^dev-.*$/i
  # 指定哪个ci runner跑该工作
  tags:
    - nezha