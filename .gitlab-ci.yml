# docker镜像
image: git.mesalab.cn:7443/nezha/nz-build-env:1.3
# 定义全局变量
variables:
  MINIO_HOST: 'http://192.168.44.36:2020/'
  MINIO_USER: 'admin'
  MINIO_PWD: "Nezha@02!"
  MAVEN_REPO: "/etc/maven/repository/"
  MARIADB_DATABASE: "test"
  MARIADB_USER: 'root'
  MARIADB_PWD: "111111"
# 依赖的docker服务
services:
#  - mariadb:10.2.14
 - redis:5.0.14
# 开始执行脚本前所需执行脚本
before_script:
  - echo "begin ci"
# 脚本执行完后的钩子，执行所需脚本
after_script:
  - echo "end ci"
# 该ci pipeline适合的场景
stages:
  - build
  - test
# maven setting /usr/share/maven/conf/settings.xml
cache:
  paths:
    - $MAVEN_REPO

# 定义的任务
build_rpm:
  stage: build
  # 所需执行的脚本
  script:
    - env | sort
    - pwd
    - export FILE_NAME=$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA.tar.gz
    - mvn clean install -Dxjar.password=afdsafasfsag -Dxjar.excludes=/db/*,/static/**/*,/install/* -Dmaven.test.skip=true
    - cd ./nz-admin/target
    - go build xjar.go 
    - chmod +x xjar 
    - tar -zcvf $FILE_NAME xjar nz-admin.xjar
    # 将 文件 上传到 minio 
    - mc alias set nz $MINIO_HOST $MINIO_USER $MINIO_PWD
    - mc cp $FILE_NAME nz/release/nz-web/$FILE_NAME
    - cd ../../
  # 在哪个分支上可用
  only:
    - /^rel-.*$/i
  # 指定哪个ci runner跑该工作
  tags:
    - nezha

# 定义的任务
dev_build:
  stage: test
  # 所需执行的脚本
  script:
    - env | sort
    - pwd
    # - echo "SELECT 'dev_build-OK';"
    # - mariadb --user=$MARIADB_USER --password=$MARIADB_PWD --host=mariadb $MARIADB_DATABASE --ssl-mode=REQUIRED
    # - echo "SELECT 'dev_build-OK-mariadb';"
    - export FILE_NAME=$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA.tar.gz
    - mvn clean install -Dxjar.password=afdsafasfsag -Dxjar.excludes=/db/*,/static/**/*,/install/* -Dmaven.test.skip=true
    - cd ./nz-admin/target
    - go build xjar.go 
    - chmod +x xjar 
    - tar -zcvf $FILE_NAME xjar nz-admin.xjar
    # 将 文件 上传到 minio 
    - mc alias set nz $MINIO_HOST $MINIO_USER $MINIO_PWD
    - mc cp $FILE_NAME nz/ci-cd/nz-web/$FILE_NAME
    - mc cp $FILE_NAME nz/ci-cd/nz-web/$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME-latest.tar.gz
    - cd ../../
  # 在哪个分支上可用
  only:
    - /^dev-.*$/i
  # 指定哪个ci runner跑该工作
  tags:
    - nezha