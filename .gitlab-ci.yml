# 全局docker镜像
image: git.mesalab.cn:7443/nezha/nz-build-env:1.3
# 定义全局变量
variables:
  MINIO_HOST: 'http://192.168.44.36:2020/'
  MINIO_USER: 'admin'
  MINIO_PWD: "Nezha@02!"
  MAVEN_REPO: "/etc/maven/repository/"
  MYSQL_DATABASE: "test"
  # mariadb 密码配置
  MYSQL_ROOT_PASSWORD: '111111'
  # 单测报告名
  JUNIT_FILE_NAME: "Network Zodiac API"
# 全局依赖的docker服务
services:
 - mariadb:10.2.14
 - redis:6.2.5
# 开始执行脚本前所需执行脚本
before_script:
  - echo "begin ci"
# 脚本执行完后的钩子，执行所需脚本
after_script:
  - echo "end ci"
# 该ci pipeline适合的场景
stages:
  - build
  - test
# maven setting /usr/share/maven/conf/settings.xml
cache:
  paths:
    - $MAVEN_REPO

# 定义的任务
build_rpm:
  stage: build
  # 所需执行的脚本
  script:
    - env | sort
    - pwd
    - export FILE_NAME=$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA.tar.gz
    - mvn clean install -Dxjar.password=afdsafasfsag -Dxjar.excludes=/db/*,/static/**/*,/install/* -Dmaven.test.skip=true
    - cd ./nz-admin/target
    - go build xjar.go 
    - chmod +x xjar 
    - tar -zcvf $FILE_NAME xjar nz-admin.xjar
    # 将 文件 上传到 minio 
    - mc alias set nz $MINIO_HOST $MINIO_USER $MINIO_PWD
    - mc cp $FILE_NAME nz/release/nz-web/$FILE_NAME
    - cd ../../
  # 在哪个分支上可用
  only:
    - /^rel-.*$/i
  # 指定哪个ci runner跑该工作
  tags:
    - nezha

# 定义的任务
dev_build:
  stage: test
  # 所需执行的脚本
  script:
    - env | sort
    - pwd
    - export FILE_NAME=$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA.tar.gz
    - export NEW_JUNIT_FILE_NAME=$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME-$JUNIT_FILE_NAME-$CI_COMMIT_SHORT_SHA.tar.gz
    - echo $JUNIT_FILE_NAME
    - echo $NEW_JUNIT_FILE_NAME
    - echo $FILE_NAME
    # -Dmaven.test.skip=true 表示跳过单元测试 , 这里其实在pom文件中设置跳过单元测试 一样会跳过单测的
#    - mvn clean install -Dxjar.password=afdsafasfsag -Dxjar.excludes=/db/*,/static/**/*,/install/*
#    - cd ./nz-admin/target
#    - go build xjar.go
#    - chmod +x xjar
#    - tar -zcvf $FILE_NAME xjar nz-admin.xjar
    # 将 文件 上传到 minio 
    - mc alias set nz $MINIO_HOST $MINIO_USER $MINIO_PWD
#    - mc cp $FILE_NAME nz/ci-cd/nz-web/$FILE_NAME
#    - mc cp $FILE_NAME nz/ci-cd/nz-web/$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME-latest.tar.gz
#    - cd ../../
#    - pwd
    - cd ./nz-admin/src/test/resources/docs
    # - tar -zcvf $NEW_JUNIT_FILE_NAME "$JUNIT_FILE_NAME".html
    - mc cp "$JUNIT_FILE_NAME".html nz/ci-cd/nz-web-junit-report/"$JUNIT_FILE_NAME"-$CI_COMMIT_SHORT_SHA.html
  # 在哪个分支上可用
  only:
    - /^dev-.*$/i
    - schedules
  # 指定哪个ci runner跑该工作
  tags:
    - nezha
