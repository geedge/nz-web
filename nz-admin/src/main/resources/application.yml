# Tomcat
server:
  http2:
    enabled: true
  ssl:
    enabled: false
    key-store: classpath:config/cert.p12
    key-store-password: nezha2021
    keyStoreType: PKCS12
    keyAlias: nezha
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    min-spare-threads: 30
    basedir: /opt/nezha/nz-web/tmp
#  port: 8088

spring:
  resources:
    static-locations: ./public/
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: prod
  autoconfigure:
    exclude: # 排除自动装配，自己实现数据库，redis 装配
      - com.alibaba.druid.spring.boot.autoconfigure.DruidDataSourceAutoConfigure
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true

  flyway:
    enabled: true              # 是否开启
    encoding: UTF-8            # 编码
    sql-migration-prefix: V    # 脚本文件的前缀，默认为V
    sql-migration-separator: __ #  双下划线
    baseline-on-migrate: true  # 连接数据库中存在表时设置为true
    locations: classpath:db    # 脚本路径
    clean-disabled: false      # flyway 的 clean 命令会删除指定 schema 下的所有 table, 生产务必禁掉。这个默认值是 false 理论上作为默认配置是不科学的
    validate-on-migrate: true # 执行迁移时是否自动调用验证   当你的 版本不符合逻辑 比如 你先执行了 DML 而没有 对应的DDL 会抛出异常
    placeholder-replacement: false  # 不做取值替换 默认替换为 ${} ，初始化sql中有sql语句存在freemarker替换，所以禁用此项
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      initial-size: 5
      max-active: 100
      min-idle: 5
      max-wait: 60000
      keep-alive: true
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      min-evictable-idle-time-millis: 600000 # 配置一个连接在连接池中的最小生存时间，单位毫秒
      max-evictable-idle-time-millis: 900000 
      validation-query: select 1 # 用来检测连接是否有效的sql
      validation-query-timeout: 1 # 单位：秒，检测连接是否有效的超时时间
      test-while-idle: true # 如果空闲时间大于timeBetweenEvictionRunsMillis，执行validationQuery检测连接是否有效
      time-between-eviction-runs-millis: 5000 # 配置间隔多久进行一次检测，检测需要关闭的空闲连接，单位毫秒
      test-on-borrow: false # 配置从连接池获取连接时，是否检查连接有效性，true每次都检查；false不检查
      test-on-return: false # 配置向连接池归还连接时，是否检查连接有效性，true每次都检查；false不检查

nezha:
  endpointStateTime: 90000   #endpoint state超时周期时间 毫秒
  userId:
    expire: 300
  cluster: false  #集群配置  true集群环境   false单机环境，还需打开pom.xml里的spring-session-data-redis注释
  globalSessionTimeout: 3600   #单机环境，session过期时间为60分钟
  promtoolPath: ./promtool
  uploadTempPath: /upload/temp
  loginExpiration: 120 #登录token 过期时间，单位 分钟 ，不设置默认为30分钟
  sessionTimeOutJobCron: 0/30 * * * * ?     # 清楚token失效定时任务 默认 5分钟
  corePoolSize: 20
  maxPoolSize: 100
  queueCapacity: 500
  alertNotifiTimeOut: 3 # alert  通知脚本等待超时时间 单位 s 秒‘
  shiroPermisSupport: false # shiro 注解支持 ， 控制 接口上 @RequiresPermissions 是否生效 ， 启用： true  不启用： false
#  inited: 2  #系统初始化状态 0 未初始化，1 配置文件初始化完成 2 所有初始化完成
  virtualAgentNum: 10 # agent 平均分配时，一致性 hash 虚节点数量
logging:
  config: ./config/logback-spring.xml

#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.nis.modules.*.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型  AUTO:"数据库ID自增", INPUT:"用户输入ID", ID_WORKER:"全局唯一ID (数字类型唯一ID)", UUID:"全局唯一ID UUID";
      id-type: AUTO
      #字段策略 IGNORED:"忽略判断",NOT_NULL:"非 NULL 判断"),NOT_EMPTY:"非空判断"
      field-strategy: NOT_NULL
      #驼峰下划线转换
      column-underline: true
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
    key-generator: com.nis.common.config.MybatisPlusConfig.SeqKeyGenerator
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'

management:
  endpoints:
    web:
      exposure:
        include: '*' # [info,health,heapdump,threaddump,env,mappings,prometheus]    #允许访问的endpoint:*所有,info,health,beans,env,loggers等
        exclude: beans
      base-path: /actuator  # http访问路径,默认：actuator
      path-mapping:
        prometheus: /prometheus
  endpoint:
    health:
      show-details: always  # always允许访问详细数据
  metrics:
    tags:
      application: nz-web # prometheus application tag ，标志一个应用