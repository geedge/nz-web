# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    min-spare-threads: 30
    basedir: /opt/nezha/nz-web/tmp
  port: 80

spring:
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: dev
  autoconfigure:
    exclude: #未初始化时，启动需排除
      - com.alibaba.druid.spring.boot.autoconfigure.DruidDataSourceAutoConfigure
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  redis:
    database: 0
    host: localhost
    port: 6379
    password:      # 密码（默认为空）
    timeout: 6000ms  # 连接超时时长（毫秒）
    jedis:
      pool:
        max-active: 1000  # 连接池最大连接数（使用负值表示没有限制）
        max-wait: -1ms      # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-idle: 10      # 连接池中的最大空闲连接
        min-idle: 5       # 连接池中的最小空闲连接
  flyway:
    enabled: true              # 是否开启
    encoding: UTF-8            # 编码
    sql-migration-prefix: V    # 脚本文件的前缀，默认为V
    sql-migration-separator: __ #  双下划线
    baseline-on-migrate: true  # 连接数据库中存在表时设置为true
    locations: classpath:db    # 脚本路径
    clean-disabled: false      # flyway 的 clean 命令会删除指定 schema 下的所有 table, 生产务必禁掉。这个默认值是 false 理论上作为默认配置是不科学的
    validate-on-migrate: true # 执行迁移时是否自动调用验证   当你的 版本不符合逻辑 比如 你先执行了 DML 而没有 对应的DDL 会抛出异常
    placeholder-replacement: false  # 不做取值替换 默认替换为 ${} ，初始化sql中有sql语句存在freemarker替换，所以禁用此项

nezha:
  endpointStateTime: 90000   #endpoint state超时周期时间 毫秒
  userId:
    expire: 300
  cluster: false  #集群配置  true集群环境   false单机环境，还需打开pom.xml里的spring-session-data-redis注释
  globalSessionTimeout: 3600   #单机环境，session过期时间为60分钟
  promtoolPath: ./promtool
  uploadTempPath: /upload/temp
  alertMessageJobCron: 0 0/1 * * * ? *   # 告警同步程序采集频率 1分钟执行一次  0/10 * * * * ?
  promserverJobCron: 0/15 * * * * ?
  assetPingJobCron: 0 0/3 * * * ? *      # asset ping job 同步程序执行频率 不设置默认情况为3分钟
  assetFeatureJobCron: 0 0 1 * * ?   # asset采集信息 默认5分钟执行一次
  alertSilenceJobCron: 0/5 * * * * ?    # 每5秒检测一次静默配置
  agentJobCron: 0/30 * * * * ?     # agent 定时任务 默认 30 s
  loginExpiration: 120 #登录token 过期时间，单位 分钟 ，不设置默认为30分钟
  corePoolSize: 20
  maxPoolSize: 100
  queueCapacity: 500
  alertNotifiTimeOut: 3 # alert  通知脚本等待超时时间 单位 s 秒‘
  shiroPermisSupport: false # shiro 注解支持 ， 控制 接口上 @RequiresPermissions 是否生效 ， 启用： true  不启用： false
  inited: 0  #系统初始化状态 0 未初始化，1 配置文件初始化完成 2 所有初始化完成
  virtualAgentNum: 10 # agent 平均分配时，一致性 hash 虚节点数量
logging:
  config: ./config/logback-spring.xml

#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.nis.modules.*.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型  AUTO:"数据库ID自增", INPUT:"用户输入ID", ID_WORKER:"全局唯一ID (数字类型唯一ID)", UUID:"全局唯一ID UUID";
      id-type: AUTO
      #字段策略 IGNORED:"忽略判断",NOT_NULL:"非 NULL 判断"),NOT_EMPTY:"非空判断"
      field-strategy: NOT_NULL
      #驼峰下划线转换
      column-underline: true
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
    key-generator: com.nis.common.config.MybatisPlusConfig.SeqKeyGenerator
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'

management:
   metrics:
    binders:
      jvm:
        enabled: false
      files:
        enabled: false
      integration:
        enabled: false
      logback:
        enabled: false
      processor:
        enabled: false
      uptime:
        enabled: false
   endpoints:
    web:
      exposure:
        include: ["prometheus"]
      base-path: "/"