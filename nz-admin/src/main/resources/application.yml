# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    min-spare-threads: 30
    basedir: /opt/nezha/nz-web/tmp
#  port: 8088

spring:
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: prod
  autoconfigure:
    exclude: # 排除自动装配，自己实现数据库，redis 装配
      - com.alibaba.druid.spring.boot.autoconfigure.DruidDataSourceAutoConfigure
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true

  flyway:
    enabled: true              # 是否开启
    encoding: UTF-8            # 编码
    sql-migration-prefix: V    # 脚本文件的前缀，默认为V
    sql-migration-separator: __ #  双下划线
    baseline-on-migrate: true  # 连接数据库中存在表时设置为true
    locations: classpath:db    # 脚本路径
    clean-disabled: false      # flyway 的 clean 命令会删除指定 schema 下的所有 table, 生产务必禁掉。这个默认值是 false 理论上作为默认配置是不科学的
    validate-on-migrate: true # 执行迁移时是否自动调用验证   当你的 版本不符合逻辑 比如 你先执行了 DML 而没有 对应的DDL 会抛出异常
    placeholder-replacement: false  # 不做取值替换 默认替换为 ${} ，初始化sql中有sql语句存在freemarker替换，所以禁用此项
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.jdbc.Driver
      initial-size: 10
      max-active: 100
      min-idle: 10
      max-wait: 60000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: false
        wall:
          config:
            multi-statement-allow: true
nezha:
  endpointStateTime: 90000   #endpoint state超时周期时间 毫秒
  userId:
    expire: 300
  cluster: false  #集群配置  true集群环境   false单机环境，还需打开pom.xml里的spring-session-data-redis注释
  globalSessionTimeout: 3600   #单机环境，session过期时间为60分钟
  promtoolPath: ./promtool
  uploadTempPath: /upload/temp
  loginExpiration: 120 #登录token 过期时间，单位 分钟 ，不设置默认为30分钟
  sessionTimeOutJobCron: 0/30 * * * * ?     # 清楚token失效定时任务 默认 5分钟
  corePoolSize: 20
  maxPoolSize: 100
  queueCapacity: 500
  alertNotifiTimeOut: 3 # alert  通知脚本等待超时时间 单位 s 秒‘
  shiroPermisSupport: false # shiro 注解支持 ， 控制 接口上 @RequiresPermissions 是否生效 ， 启用： true  不启用： false
#  inited: 2  #系统初始化状态 0 未初始化，1 配置文件初始化完成 2 所有初始化完成
  virtualAgentNum: 10 # agent 平均分配时，一致性 hash 虚节点数量
logging:
  config: classpath:config/logback-spring.xml

#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.nis.modules.*.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型  AUTO:"数据库ID自增", INPUT:"用户输入ID", ID_WORKER:"全局唯一ID (数字类型唯一ID)", UUID:"全局唯一ID UUID";
      id-type: AUTO
      #字段策略 IGNORED:"忽略判断",NOT_NULL:"非 NULL 判断"),NOT_EMPTY:"非空判断"
      field-strategy: NOT_NULL
      #驼峰下划线转换
      column-underline: true
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
    key-generator: com.nis.common.config.MybatisPlusConfig.SeqKeyGenerator
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'

management:
   metrics:
    binders:
      jvm:
        enabled: false
      files:
        enabled: false
      integration:
        enabled: false
      logback:
        enabled: false
      processor:
        enabled: false
      uptime:
        enabled: false
   endpoints:
    web:
      exposure:
        include: ["prometheus"]
      base-path: "/"