<!DOCTYPE html>
<html>
<head>
<title>业务系统管理</title>
<#include "/header.html">
</head>
<body>
<div id="rrapp" v-cloak>
	<div v-show="showList">
		<div class="grid-btn">
			<a class="btn btn-primary" @click="add"><i class="fa fa-plus"></i>&nbsp;新增</a>
			<a class="btn btn-primary" @click="update"><i class="fa fa-pencil-square-o"></i>&nbsp;修改</a>
			<a class="btn btn-primary" @click="del"><i class="fa fa-trash-o"></i>&nbsp;删除</a>
		</div>
	    <table id="jqGrid"></table>
	    <div id="jqGridPager"></div>
    </div>
     
   	<div v-show="!showList" class="panel panel-default">
		<div class="panel-heading">{{title}}</div>
		<form class="form-horizontal">
			<div class="form-group">
			   	<div class="col-sm-2 control-label">名称</div>
			   	<div class="col-sm-9">
			        <input type="text" class="form-control" :class="{'form-control--error': $v.system.name.$dirty && $v.system.name.$error}" v-model.trim="$v.system.name.$model"/>
			        <span class="required-symbol">*</span>
			        <div class="form-control_error-msg" v-if="$v.system.name.$dirty && !$v.system.name.required">必填项</div>
			    </div>
			</div>
			<div class="form-group">
			   	<div class="col-sm-2 control-label">用户组</div>
			   	<div class="col-sm-9">
			   		<template v-for="ug in usergroups">
				    	<span class="form-cbx">
				    		<input v-model="system.usergroupIds" type="checkbox" :value="ug.id"/>
				    		<span :title="ug.name">{{ug.name}}</span>
				    	</span>
			    	</template>
			    </div>
			</div>
			<div class="form-group">
			   	<div class="col-sm-2 control-label">备注</div>
			   	<div class="col-sm-9">
			      <input type="text" class="form-control" v-model="system.remarks"/>
			    </div>
			</div>
			<div class="form-group">
				<div class="col-sm-2 control-label"></div> 
				<input type="button" class="btn btn-primary" @click="saveOrUpdate" value="确定"/>
				&nbsp;&nbsp;<input type="button" class="btn btn-warning" @click="reload" value="返回"/>
			</div>
		</form>
	</div>
</div>

<script src="${request.contextPath}/statics/js/modules/sys/system.js?_${.now?long}"></script>
</body>
</html>
