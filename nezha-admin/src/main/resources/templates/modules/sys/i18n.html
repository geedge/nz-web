<!DOCTYPE html>
<html>
<head>
<title>国际化管理</title>
<#include "/header.html">
</head>
<body>
<div id="rrapp" v-cloak>
	<div v-show="showList">
		<div class="grid-btn">
			<div class="form-group col-sm-2">
				<input type="text" class="form-control" v-model="q.code" @keyup.enter="query" placeholder="code">
			</div>
			<div class="form-group col-sm-2">
				<select class="form-control q-select2">
					<option selected="selected" value="">请选择语言</option>
					<option v-for="option in langList" v-bind:value="option.value">{{option.value}}</option>
				</select>
			</div>
			<a class="btn btn-default" @click="query">查询</a>
			
			<a class="btn btn-primary" @click="add"><i class="fa fa-plus"></i>&nbsp;新增</a>
			<a class="btn btn-primary" @click="update"><i class="fa fa-pencil-square-o"></i>&nbsp;修改</a>
			<a class="btn btn-primary" @click="del"><i class="fa fa-trash-o"></i>&nbsp;删除</a>
		</div>
	    <table id="jqGrid"></table>
	    <div id="jqGridPager"></div>
    </div>
     
   	<div v-show="!showList" class="panel panel-default">
		<div class="panel-heading">{{title}}</div>
		<form class="form-horizontal">
			<div class="form-group">
			   	<div class="col-sm-2 control-label">CODE</div>
			   	<div class="col-sm-10">
			      <input type="text" class="form-control" v-model="i18n.code"/>
			    </div>
			</div>
			<div class="form-group">
			   	<div class="col-sm-2 control-label">语言</div>
			   	<div class="col-sm-10">
			   		<!-- select2会将select重新渲染，v-model会失效，需要在js中手动为对象赋值 -->
			    	<select class="form-select2">
			    		<option disabled selected="selected">...</option>
						<option v-for="option in langList" v-bind:value="option.value">{{option.value}}</option>
					</select>
			    </div>
			</div>
			<div class="form-group">
			   	<div class="col-sm-2 control-label">VALUE</div>
			   	<div class="col-sm-10">
			      <input type="text" class="form-control" v-model="i18n.value"/>
			    </div>
			</div>
			<div class="form-group">
			   	<div class="col-sm-2 control-label">备注</div>
			   	<div class="col-sm-10">
			      <input type="text" class="form-control" v-model="i18n.remark"/>
			    </div>
			</div>
			<div class="form-group">
				<div class="col-sm-2 control-label"></div> 
				<input type="button" class="btn btn-primary" @click="saveOrUpdate" value="确定"/>
				&nbsp;&nbsp;<input type="button" class="btn btn-warning" @click="reload" value="返回"/>
			</div>
		</form>
	</div>
</div>

<script src="${request.contextPath}/statics/js/modules/sys/i18n.js?_${.now?long}"></script>
</body>
</html>
