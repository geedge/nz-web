<!DOCTYPE html>
<html>
<head>
<title>任务管理</title>
<#include "/header.html">
<link rel="stylesheet" href="${request.contextPath}/statics/css/mission.css">
</head>
<body>
<div id="missionVIew" v-cloak>
	<div v-show="showList">
		<div class="grid-btn">
			<div class="form-group col-sm-2">
				任务名称 : <input type="text" class="form-control" v-model="q.name" @keyup.enter="query" >
			</div>
			<!-- <div class="form-group col-sm-2">
				是否为周期任务:<multiselect v-model=""></multiselect>
			</div>
			<div class="form-group col-sm-2">
				任务状态:<multiselect v-model="" ></multiselect>
			</div>
			<div class="form-group col-sm-2">
				任务类型:<multiselect v-model=""></multiselect>
			</div> -->
			<a class="btn btn-default" @click="query">查询</a>
			<a class="btn btn-primary" @click="add"><i class="fa fa-plus"></i>&nbsp;新增</a>
			<a class="btn btn-primary" @click=""><i class="fa fa-plus"></i>&nbsp;新增逆向任务</a>
			<a class="btn btn-primary" @click="update"><i class="fa fa-pencil-square-o"></i>&nbsp;修改</a>
			<a class="btn btn-success" @click="converseStatus(1)"><i class="fa fa-play"></i>&nbsp;启用</a>
			<a class="btn btn-danger" @click="converseStatus(2)"><i class="fa fa-ban"></i>&nbsp;停用</a>
		</div>
	    <table id="jqGrid"></table>
	    <div id="jqGridPager"></div>
    </div>
     
   	<div v-show="!showList" class="panel panel-default">
		<div class="panel-heading">{{title}}</div>
		<form class="form-horizontal">
			<div class="form-group">
			   	<div class="col-sm-2 control-label">任务名称</div>
			   	<div class="col-sm-10">
			        <input type="text" class="form-control" :class="{'form-control--error': $v.mission.name.$dirty && !$v.mission.name.required}" v-model.trim="$v.mission.name.$model"/>
			        <span class="required-symbol">*</span>
			        <div class="form-control_error-msg" v-if="$v.mission.name.$dirty && !$v.mission.name.required">必填项</div>
			    </div>
			</div>
			<div class="form-group">
			   	<div class="col-sm-2 control-label">任务描述</div>
			   	<div class="col-sm-10">
					<textarea placeholder="" v-model.trim="mission.remark"></textarea>
			    </div>
			</div>
			<div class="form-group">
				<div class="col-sm-2 control-label"></div> 
				<input type="button" class="btn btn-primary" @click="saveOrUpdate" value="确定"/>
				&nbsp;&nbsp;<input type="button" class="btn btn-warning" @click="reload" value="返回"/>
			</div>
		</form>
	</div>
</div>

<script src="${request.contextPath}/statics/js/modules/mission/mission.js?_${.now?long}"></script>
</body>
</html>
