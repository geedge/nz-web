<script type="text/x-template" id="rTable">
    <div>
        <table class="r-table" border="1px" id="r-tab-id" >
            <tr>
                <th width="30px"></th>
                <th width="30px"><span class="r-checkbox checkbox_false_full" id="r-tab-checkall"/></th>
                <th v-for="cm,index in colModel" class="r-tab-th" v-width="cm.width">{{cm.name}}</th>
            </tr>
            <tbody>
                <template v-if="trReset & tableData.length>0"  v-for="rdata,index in tableData" >
                    <r-tr
                            ref="r-tr-ref"
                            :rowData="rdata"
                            :colModel="colModel"
                            :index="index"
                            :identification="identification"
                            :refKey="trRefKey"
                            @checkRow="checkRow"
                            @unCheckRow="unCheckRow"

                    ></r-tr>
                </template>
                <template v-if="tableData.length==0"  >
                    <tr>
                        <td :colspan="colLen" class="text-center">暂无数据</td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</script>

<script type="text/x-template" id="rRow">
    <tr v-id:[trId] = "index" class="" >
        <td>{{index+1}} </td>
        <td><span :id="trId+'-'+index+'-checkbox'" class="r-checkbox checkbox_false_full" :title="rowData.trRemark"/></td>
        <td v-for="cm,i in colModel" v-id:[tdId]="i" v-html="cm.formatter==undefined||cm.formatter==null?rowData[cm.field]:cm.formatter(rowData)"></td>
    </tr>
</script>

<script type="text/x-template" id="nzNodeSelector">
    <div class="panel panel-default main">
        <div class="left scrollbar">
            <nz-tree
                    :tree-data="treeData"
                    @tree-click="clickNode"
                    @tree-select="selectedTreeDatasChange"
                    ref="treeChild"
            ></nz-tree>
        </div>
        <div class="right" style="padding-top:10px">
            <nz-table
                    ref="nzTable"
                    :table-data="tableData"
                    :col-model="colModel"
                    :identification="key"
                    @selectedDatasChange="selectedTableDatasChange"
            ></nz-table>
        </div>
    </div>
</script>

<script id="nzTree" type="text/x-template">
    <div>
        <ul id="beTree" class="ztree"></ul>
    </div>
</script>
