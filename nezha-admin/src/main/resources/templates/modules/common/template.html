<script type="text/x-template" id="rTable">
    <div>
        <table class="r-table" :id="'r-tab-'+tabNo+'-id'">
			<thead>
            	<tr>
                	<th width="30px"></th>
                	<th width="30px"><span class="r-checkbox checkbox_false_full" :id="'r-tab-'+tabNo+'-checkall'"/></th>
                	<th v-for="cm,index in colModel" class="r-tab-th" v-width="cm.width">{{cm.name}}</th>
            	</tr>
			</thead>
            <tbody>
                <template v-if="trReset & tableData.length>0"  v-for="rdata,index in tableData" >
                    <r-tr
                            ref="r-tr-ref"
                            :rowData="rdata"
                            :colModel="colModel"
                            :index="index"
                            :identification="identification"
                            :refKey="trRefKey"
                            @checkRow="checkRow"
                            @unCheckRow="unCheckRow"
                            :tab-no="tabNo"
                    ></r-tr>
                </template>
                <template v-if="tableData.length==0"  >
                    <tr>
                        <td :colspan="colLen" class="text-center">暂无数据</td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</script>

<script type="text/x-template" id="rRow">
    <tr :id="'tab-'+tabNo+'-'+trId+'-'+index" class="" >
        <td>{{index+1}} </td>
        <td><span :id="'tab-'+tabNo+'-'+trId+'-'+index+'-checkbox'" class="r-checkbox checkbox_false_full" :title="rowData.trRemark"/></td>
        <td v-for="cm,i in colModel" :id="'tab-'+tabNo+'-tr-'+index+'-'+tdId+'-'+i" v-html="cm.formatter==undefined||cm.formatter==null?rowData[cm.field]:cm.formatter(rowData)"></td>
    </tr>
</script>

<script type="text/x-template" id="nzNodeSelector">
    <div class="main">
        <div class="left nodeTree">
            <nz-tree
                    :tree-data="treeData"
                    @tree-click="clickNode"
                    @tree-select="selectedTreeDatasChange"
                    ref="treeChild"
            ></nz-tree>
        </div>
        <div class="right">
            <nz-table
                    ref="nzTable"
                    :table-data="tableData"
                    :col-model="colModel"
                    :identification="key"
                    @selectedDatasChange="selectedTableDatasChange"
            ></nz-table>
        </div>
    </div>
</script>
<script id="nzTree" type="text/x-template">
	<ul id="beTree" class="ztree"></ul>
</script>
