<script id="popUpWindow" type="text/x-template">
    <div id="layerView" class="panel panel-default main">
        <div class="alert alert-warning alert-dismissible" id="panel-warn-msg" style="display:none;">
            {{warnMessage}}
        </div>
        <div class="left scrollbar">
            <left-tree
                    v-bind:znode="znode"
                    @tree-click="clickNode"
                    @tree-select="checkNode"
                    :uncheck-node="uncheckNode"
                    ref="treeChild"
            ></left-tree>
        </div>
        <div class="right" style="padding-top:10px">
            <!--            <right-table :list-url="listUrl" :list-colmodel="listColmodel" :post-data="postData"></right-table>-->
            <v-table
                    ref="rightTable"
                    is-horizontal-resize
                    style="width:99%"
                    :height="990"
                    is-vertical-resize=true
                    :columns="columns"
                    :table-data="tdata"
                    :show-vertical-border="false"
                    :vertical-resize-offset='5'
                    row-hover-color="#eee"
                    row-click-color="#edf7ff"
                    :select-all="selectALL"
                    :select-change="selectChange"
                    :select-group-change="selectGroupChange"
                    :column-cell-class-name="tableRowClassChange"
            ></v-table>
        </div>
    </div>
</script>


<script id="leftTree" type="text/x-template">
    <div>
        <ul id="beTree" class="ztree"></ul>
    </div>
</script>

<script id="labelInput" type="text/x-template">
    <div class="input-group" >
        <label class="input-group-addon">
            {{label}}
        </label>
        <input type="text" style="z-index:0;" class="form-control" :value="value" @input="$emit('input', $event.target.value)"/>
    </div>
</script>
