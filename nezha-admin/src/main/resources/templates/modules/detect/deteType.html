<!DOCTYPE html>
<html>
<head>
    <title>监测类别</title>
</head>
<#include "/header.html">

<body>
<div id="deteType" v-cloak>
    <div v-show="showList">
        <div class="grid-btn">
            <div class="form-group col-sm-2">
                <input type="text" class="form-control" v-model.trim="params.name" @keyup.enter="query" placeholder="监测类别名称">
            </div>
            <a class="btn btn-default" @click="query">查询</a>

            <a class="btn btn-primary" @click="add"><i class="fa fa-plus"></i>&nbsp;新增</a>
            <a class="btn btn-primary" @click="update"><i class="fa fa-pencil-square-o"></i>&nbsp;修改</a>
            <a class="btn btn-primary" @click="del"><i class="fa fa-trash-o"></i>&nbsp;删除</a>
        </div>
        <table id="jqGrid"></table>
        <div id="jqGridPager"></div>
    </div>
    <div v-show="!showList" class="panel panel-default">
        <div class="panel-heading">{{title}}</div>
        <form class="form-horizontal" >
            <!--deteTypeView start-->
            <div id="deteTypeView" v-show="curStep == 0">
                <div class="form-group">
                    <div class="col-sm-2 control-label">监测类别名称:</div>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" :class="{'form-control--error': $v.deteType.name.$dirty && !$v.deteType.name.required|| $v.deteType.name.nameRepeat}" v-model.trim="$v.deteType.name.$model"/>
                        <span class="required-symbol">*</span>
                        <div class="form-control_error-msg" v-if="$v.deteType.name.$dirty && !$v.deteType.name.required">必填项</div>
                        <div class="form-control_error-msg" v-if="$v.deteType.name.$dirty && $v.deteType.name.nameRepeat">名字已存在</div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-2 control-label">监控方式:</div>
                    <div class="col-sm-9">
                        <multiselect v-model="deteMethod" :options="deteMethods" placeholder="请选择" track-by="code" label="value" :searchable="false" value="deteMethod" :allow-empty="false" deselect-label="Can't remove this value"></multiselect>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-2 control-label">间隔:</div>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" :class="{'form-control--error': $v.deteType.deteInterval.$dirty && !$v.deteType.deteInterval.integer}" v-model.trim="$v.deteType.deteInterval.$model"/>
                        <span class="required-symbol">*</span>
                        <div class="form-control_error-msg" v-if="$v.deteType.deteInterval.$dirty && !$v.deteType.deteInterval.integer">整数类型</div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-2 control-label">内容:</div>
                    <div class="col-sm-9">
                        <textarea v-model.trim="$v.deteType.content.$model" class="form-control" ></textarea>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-2 control-label">国际化CODE:</div>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" :class="{'form-control--error': $v.deteType.i18nCode.$dirty && !$v.deteType.i18nCode.required }" v-model.trim="$v.deteType.i18nCode.$model"/>
                        <span class="required-symbol">*</span>
                        <div class="form-control_error-msg" v-if="$v.deteType.i18nCode.$dirty && !$v.deteType.i18nCode.required">必填项</div>

                    </div>
                </div>

                <div class="form-group">
                    <div class="col-sm-2 control-label">备注:</div>
                    <div class="col-sm-9">
                        <textarea v-model.trim="$v.deteType.remark.$model" class="form-control" ></textarea>
                    </div>
                </div>
            </div> <!--deteTypeView end-->

            <!--    deteTypeMetaView start-->
            <div id="deteTypeMetaView" v-show="curStep == 1" v-model="deteType.deteTypeMetas">
                <div v-for="item ,index in deteType.deteTypeMetas">
                    <div class="panel panel-default" style="position:relative">
                        <div class="form-group">
                            <div class="col-sm-2 control-label">名称:</div>
                            <div class="col-sm-9">
                                <input type="text"  class="form-control"  :class="{'form-control--error': ($v.deteType.deteTypeMetas.$each[index].name.$dirty && !$v.deteType.deteTypeMetas.$each[index].name.required) || $v.deteType.deteTypeMetas.$each[index].name.metaNameRepeat}"  v-model.trim="$v.deteType.deteTypeMetas.$each[index].name.$model" value="{{item.name}}"/>
                                <span class="required-symbol">*</span>
                                <div class="form-control_error-msg" v-if="$v.deteType.deteTypeMetas.$each[index].name.$dirty && !$v.deteType.deteTypeMetas.$each[index].name.required">必填项</div>
                                <div class="form-control_error-msg" v-if="$v.deteType.deteTypeMetas.$each[index].name.$dirty && $v.deteType.deteTypeMetas.$each[index].name.metaNameRepeat">名称重复</div>
                                <!--<pre>{{$v.deteType.deteTypeMetas.$each[index].name}}</pre>-->
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-2 control-label">字段类型:</div>
                            <div class="col-sm-9">
                                <multiselect v-model="$v.deteType.deteTypeMetas.$each[index].fieldType.$model" :class="{'form-control--error': $v.deteType.deteTypeMetas.$each[index].fieldType.$dirty && !$v.deteType.deteTypeMetas.$each[index].fieldType.required}":options="fieldTypes" placeholder="请选择" track-by="code" label="value" :searchable="false"  :allow-empty="false" deselect-label="Can't remove this value"></multiselect>
                                <span class="required-symbol">*</span>
                                <div class="form-control_error-msg" v-if="$v.deteType.deteTypeMetas.$each[index].fieldType.$dirty && !$v.deteType.deteTypeMetas.$each[index].fieldType.required">必填项</div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-2 control-label">数据类型:</div>
                            <div class="col-sm-9">
                                <multiselect v-model="$v.deteType.deteTypeMetas.$each[index].dataType.$model" :class="{'form-control--error': $v.deteType.deteTypeMetas.$each[index].dataType.$dirty && !$v.deteType.deteTypeMetas.$each[index].dataType.required}" :options="dataTypes" placeholder="请选择" track-by="code" label="value" :searchable="false" :allow-empty="false" deselect-label="Can't remove this value"></multiselect>
                                <span class="required-symbol">*</span>
                                <div class="form-control_error-msg" v-if="$v.deteType.deteTypeMetas.$each[index].dataType.$dirty && !$v.deteType.deteTypeMetas.$each[index].dataType.required">必填项</div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-2 control-label">数据长度:</div>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" :class="{'form-control--error': $v.deteType.deteTypeMetas.$each[index].dataLenth.$dirty && !$v.deteType.deteTypeMetas.$each[index].dataLenth.required||!$v.deteType.deteTypeMetas.$each[index].dataLenth.integer}" v-model.trim="$v.deteType.deteTypeMetas.$each[index].dataLenth.$model" value="{{$v.deteType.deteTypeMetas.$each[index].dataLenth.$model}}"/>
                                <span class="required-symbol">*</span>
                                <div class="form-control_error-msg" v-if="$v.deteType.deteTypeMetas.$each[index].dataLenth.$dirty && !$v.deteType.deteTypeMetas.$each[index].dataLenth.required">必填项</div>
                                <div class="form-control_error-msg" v-if="$v.deteType.deteTypeMetas.$each[index].dataLenth.$dirty && !$v.deteType.deteTypeMetas.$each[index].dataLenth.integer">整数类型</div>
                            </div>
                        </div>
                        <div class="form-group" v-show="deteType.method==2">
                            <div class="col-sm-2 control-label">OID:</div>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" :class="{'form-control--error':$v.deteType.deteTypeMetas.$each[index].oid.$dirty &&!$v.deteType.deteTypeMetas.$each[index].oid.required}" v-model.trim="$v.deteType.deteTypeMetas.$each[index].oid.$model"/>
                                <span class="required-symbol">*</span>
                                <div class="form-control_error-msg" v-if="$v.deteType.deteTypeMetas.$each[index].oid.$dirty && !$v.deteType.deteTypeMetas.$each[index].oid.required">必填项</div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-2 control-label">单位:</div>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" :class="{'form-control--error':$v.deteType.deteTypeMetas.$each[index].unit.$dirty && !$v.deteType.deteTypeMetas.$each[index].unit.required}" v-model.trim="$v.deteType.deteTypeMetas.$each[index].unit.$model" />
                                <span class="required-symbol">*</span>
                                <div class="form-control_error-msg" v-if="$v.deteType.deteTypeMetas.$each[index].unit.$dirty && !$v.deteType.deteTypeMetas.$each[index].unit.required">必填项</div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-2 control-label">字典类型:</div>
                            <div class="col-sm-9">
                                <multiselect v-model="deteType.deteTypeMetas[index].dicType" :options="dicTypes" placeholder="请选择"  :searchable="false" value="dataType" ></multiselect>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-2 control-label">备注:</div>
                            <div class="col-sm-9">
                                <textarea v-model.trim="deteType.deteTypeMetas[index].remark" class="form-control" ></textarea>
                            </div>
                        </div>
                        <!--删除按钮-->
                        <div style="position:absolute;top: 0;right: -50px;">
                            <a class="btn btn-small" @click="delMetaView(index)"><i class="glyphicon glyphicon-trash"></i></a>
                        </div>
                    </div>
                </div>
<!--                <pre>{{$data}}</pre>-->
                <div class="form-group">
                    <a id="metaPlus" class="btn btn-small" @click="addMetaView"><i class="glyphicon glyphicon-plus"></i>添加元数据</a>
                </div>
            </div>
            <!--deteTypeMetaView end-->

            <!--deteTypeParam start-->
            <div id="deteTypeParamView" v-show="curStep == 2" v-model="deteType.deteTypeMetas">
                <div v-for="item ,index in deteType.deteTypeParams">
                    <div class="panel panel-default" style="position:relative">
                        <div class="form-group">
                            <div class="col-sm-2 control-label">名称:</div>
                            <div class="col-sm-9">
                                <input type="text"  class="form-control" :class="{'form-control--error': ($v.deteType.deteTypeParams.$each[index].name.$dirty && !$v.deteType.deteTypeParams.$each[index].name.required)}"  v-model.trim="$v.deteType.deteTypeParams.$each[index].name.$model" value="{{item.name}}"/>
                                <span class="required-symbol">*</span>
                                <div class="form-control_error-msg" v-if="$v.deteType.deteTypeParams.$each[index].name.$dirty && !$v.deteType.deteTypeParams.$each[index].name.required">必填项</div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-2 control-label">默认参数:</div>
                            <div class="col-sm-9">
                                <input type="text"  class="form-control" :class="{'form-control--error': ($v.deteType.deteTypeParams.$each[index].defVal.$dirty && !$v.deteType.deteTypeParams.$each[index].defVal.required)}"  v-model.trim="$v.deteType.deteTypeParams.$each[index].defVal.$model" value="{{item.defVal}}"/>
                                <span class="required-symbol">*</span>
                                <div class="form-control_error-msg" v-if="$v.deteType.deteTypeParams.$each[index].defVal.$dirty && !$v.deteType.deteTypeParams.$each[index].defVal.required">必填项</div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-2 control-label">备注:</div>
                            <div class="col-sm-9">
                                <input type="text"  class="form-control"   v-model.trim="$v.deteType.deteTypeParams.$each[index].remark.$model" value="{{item.remark}}"/>
                            </div>
                        </div>
                        <!--删除按钮-->
                        <div style="position:absolute;top: 0;right: -50px;">
                            <a class="btn btn-small" @click="delParamView(index)"><i class="glyphicon glyphicon-trash"></i></a>
                        </div>
                    </div>
                </div>
                <!--                <pre>{{$data}}</pre>-->
                <div class="form-group">
                    <a id="paramPlus" class="btn btn-small" @click="addParamView"><i class="glyphicon glyphicon-plus"></i>添加参数</a>
                </div>
            </div>
            <!--deteTypeParam end-->
            <div class="form-group">
                    <div class="col-sm-2 control-label"></div>
                    <input type="button" class="btn btn-primary" @click="saveOrUpdate" value="确定"/>
                    &nbsp;&nbsp;<input  type="button" class="btn btn-default"  @click="preStep" value="上一步"/>
                    &nbsp;&nbsp;<input type="button" class="btn btn-default"  @click="nextStep" value="下一步"/>
                    &nbsp;&nbsp;<input type="button" class="btn btn-warning" @click="reload"  value="返回"/>
            </div>


        </form>
    </div>
</div>
<script src="${request.contextPath}/statics/js/modules/detect/main.js?_${.now?long}"></script>
<script src="${request.contextPath}/statics/js/modules/detect/deteType.js?_${.now?long}"></script>

</body>
</html>
