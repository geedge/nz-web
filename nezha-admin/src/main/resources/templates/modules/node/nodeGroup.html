<!DOCTYPE html>
<#import "/spring.ftl" as spring>
<html>
<head>
    <title>节点组管理</title>
    <#include "/header.html">
</head>
<body>

<!-- 节点组 -->
<div id="app" v-cloak style="float: left;">

    <div class="" style="margin-top:30px;margin-left:26px;width: 300px;height: 100%;background-color: #c4e3f3">
        <!--background-color: papayawhip-->
        <div class="" v-for="item in systems">
            <div>
                <div style="float:left"><strong class="col-sm-5 control-label"
                                                @click="showTree(item)">{{item.name}}</strong></div>
                <div style="float:right;margin-right: 20px"><a href="#" @click="add(item)">添加根节点组</a></div>
            </div>
            <div class="col-sm-10">
                <ul :id="item.id" class="ztree"></ul>
            </div>
        </div>
    </div>

    <div v-show="showForm" id="form" v-cloak style="width: 100%;height: 100%;">
        <div class="panel panel-default">
            <form class="form-horizontal">
                <div class="form-group">
                    <div class="col-sm-2 control-label">上级节点组</div>
                    <div class="col-sm-9">
                        <input disabled type="text"
                               v-model.trim="nodeGroup.parentGroup.name" class="form-control"
                               placeholder="上级节点组"/>
                        <span class="required-symbol">*</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="col-sm-2 control-label">业务系统</div>
                    <div class="col-sm-9">
                        <input disabled type="text" v-model.trim="system.name" class="form-control"
                               placeholder="业务系统"/>
                    </div>
                </div>

                <div class="form-group">
                    <div class="col-sm-2 control-label">节点组名称</div>
                    <div class="col-sm-9">
                        <input type="text" v-model.trim="nodeGroup.name" class="form-control"
                               :class="{'form-control--error': $v.nodeGroup.name.$dirty && !$v.nodeGroup.name.required}"
                               @blur="$v.nodeGroup.name.$touch" placeholder="节点组名称"/>
                        <span class="required-symbol">*</span>
                        <div class="form-control_error-msg"
                             v-if="$v.nodeGroup.name.$dirty && !$v.nodeGroup.name.required">
                            必填项
                        </div>
                        <div class="form-control_error-msg"
                             v-if="$v.nodeGroup.name.$dirty && !$v.nodeGroup.name.nameCheck">
                            名称重复
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <div class="col-sm-2 control-label">备注</div>
                    <div class="col-sm-9">
                        <input type="text" v-model.trim="nodeGroup.remark" class="form-control" placeholder="备注"/>
                    </div>
                </div>
            </form>
            <div class="form-group">
                <input type="button" class="btn btn-warning" @click="saveOrUpdate" value="保存"/>
                &nbsp;&nbsp;<input type="button" class="btn btn-primary" @click="reload" value="关闭"/>
            </div>
        </div>
    </div>
</div>

<!-- 节点 -->
<div id="nodeInfoApp" style="float: left;height: 100%;width: 1200px;margin-top: 135px" v-cloak>

    <div class="form-group">
       <a class="" href="#" style="font-size: 16px;">节点列表</a>
        <a v-if="nodeGroup != null" class="" href="#" style="font-size: 16px;"> {{nodeGroup.name}}</a>
        <a v-if="nodeGroup != null && nodeGroup.allowAss == 1" class="btn btn-primary" @click="" style="float: right"><i class="fa"></i>&nbsp;分配节点</a>
    </div>

    <div v-show="showList">
        <div class="grid-btn">
            <div class="form-group col-sm-2">
                <input type="text" class="form-control" v-model="q.name" @keyup.enter="query"
                       placeholder="节点名称">
            </div>
            <div class="form-group col-sm-2">
                <input type="text" class="form-control" v-model="q.ip" @keyup.enter="query"
                       placeholder="IP地址">
            </div>

            <div class="form-group col-sm-2">
                <multiselect v-model="q.type" :options="nodeTypes" label="name" :show-labels="false"
                             placeholder="设备类型" @close="getQueryTag"></multiselect>
            </div>

            <div class="form-group col-sm-2">
                <multiselect v-model="q.tag" :options="queryTags" label="value" :show-labels="false"
                             placeholder="设备标签" @open="checkQueryTag"></multiselect>
            </div>


            <div class="form-group col-sm-2">
                <multiselect v-model="q.state" placeholder="在线状态" :show-labels="false" :options="nodeStates"
                             label="name"></multiselect>
            </div>

            <a class="btn btn-default" @click="query">查询</a>
            <a class="btn btn-default" @click="reset">重置</a>
        </div>
        <table id="jqGrid"></table>
        <div id="jqGridPager"></div>

    </div>
</div>


<!--<script src="${request.contextPath}/statics/js/modules/node/nodeInfo.js"></script>-->
<!--<script src="${request.contextPath}/statics/js/modules/node/nodeGroup.js"></script>-->
<#include "/js/modules/node/nodeInfo.js">
<#include "/js/modules/node/nodeGroup.js">
</body>
</html>
