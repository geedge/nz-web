<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>NEZHA</title>
  <!-- Tell the browser to be responsive to screen width -->
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
  <link rel="stylesheet" href="${request.contextPath}/statics/css/bootstrap.min.css">
  <link rel="stylesheet" href="${request.contextPath}/statics/css/font-awesome.min.css">
  <link rel="stylesheet" href="${request.contextPath}/statics/css/AdminLTE.min.css">
  <link rel="stylesheet" href="${request.contextPath}/statics/libs/vue-multiselect.min.css">
  <!-- AdminLTE Skins. Choose a skin from the css/skins
       folder instead of downloading all of them to reduce the load. -->
  <link rel="stylesheet" href="${request.contextPath}/statics/css/all-skins.min.css">
  <link rel="stylesheet" href="${request.contextPath}/statics/css/main.css">
  <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
  <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
  <!--[if lt IE 9]>
  <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
  <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
  <![endif]-->
  <style>
  .select2-container--default .select2-selection--single .select2-selection__arrow {
	top: 4px;
  }
  .select2-container--default .select2-selection--single .select2-selection__rendered {
    line-height: 28px;
  }
  </style>
</head>
<body class="hold-transition login-page" style="min-height: 650px;">
<div class="login-box" id="rrapp" v-cloak>
  <div class="login-logo">
    <b>NEZHA</b>
  </div>
  <!-- /.login-logo -->
  <div class="login-box-body" v-show="showLogin">
      <p class="login-box-msg">登录</p>
      <div v-if="error" class="alert alert-danger alert-dismissible">
        <h4 style="margin-bottom: 0px;"><i class="fa fa-exclamation-triangle"></i> {{errorMsg}}</h4>
      </div>
      <div class="form-group has-feedback">
        <input type="text" class="form-control" v-model="username" placeholder="账号">
        <span class="glyphicon glyphicon-user form-control-feedback"></span>
      </div>
      <div class="form-group has-feedback">
        <input type="password" class="form-control" v-model="password" placeholder="密码">
        <span class="glyphicon glyphicon-lock form-control-feedback"></span>
      </div>
      <div class="form-group has-feedback">
        <input type="text" class="form-control" v-model="captcha" @keyup.enter="login" placeholder="验证码">
        <span class="glyphicon glyphicon-warning-sign form-control-feedback"></span>
      </div>
      <div class="form-group has-feedback">
        <img alt="如果看不清楚，请单击图片刷新！" class="pointer" :src="src" @click="refreshCode">
        &nbsp;&nbsp;&nbsp;&nbsp;<a href="javascript:;" @click="refreshCode">点击刷新</a>
      </div>
      
      
      <div class="row">
        <div class="col-xs-8">
          <div class="checkbox icheck">
          </div>
        </div>
        <!-- /.col -->
        <div class="col-xs-4">
          <button type="button" class="btn btn-primary btn-block btn-flat" @click="login">登录</button>
        </div>
        <!-- /.col -->
      </div>
    <!-- /.social-auth-links -->

  </div>
  <!-- /.login-box-body -->
  
  <div class="login-box-body" v-show="!showLogin">
  	<p class="login-box-msg">选择业务系统</p>
    <div class="form-group has-feedback">
      <multiselect v-model="selectedSystem" :options="systems" label="name" placeholder="请选择"></multiselect>
    </div>
    <div class="row">
      <div class="col-xs-4">
        <div class="checkbox icheck">
        </div>
      </div>
      <div class="col-xs-4">
        <button type="button" class="btn btn-primary btn-block btn-flat" @click="selectSys">确定</button>
      </div>
      <div class="col-xs-4">
        <button type="button" class="btn btn-primary btn-block btn-flat" @click="cancelSelect">取消</button>
      </div>
    </div>
  </div>
  
</div>
<!-- /.login-box -->

<script src="${request.contextPath}/statics/libs/jquery.min.js"></script>
<script src="${request.contextPath}/statics/libs/vue.min.js"></script>
<script src="${request.contextPath}/statics/libs/vue-multiselect.min.js"></script>
<script src="${request.contextPath}/statics/libs/vuelidate.min.js"></script>
<script src="${request.contextPath}/statics/libs/validators.min.js"></script>
<script src="${request.contextPath}/statics/libs/bootstrap.min.js"></script>
<script src="${request.contextPath}/statics/libs/jquery.slimscroll.min.js"></script>
<script src="${request.contextPath}/statics/libs/fastclick.min.js"></script>
<script src="${request.contextPath}/statics/plugins/layer/layer.js"></script>
<script src="${request.contextPath}/statics/libs/app.js"></script>
<script type="text/javascript">
//注册select组件
Vue.component('multiselect', window.VueMultiselect.default);
//引用vuelidate组件
Vue.use(window.vuelidate.default);
//引用校验规则
var required = window.validators.required;

var vm = new Vue({
	el:'#rrapp',
	data:{
		username: '',
		password: '',
		captcha: '',
		error: false,
		errorMsg: '',
		src: 'captcha.jpg',
		showLogin: true,
		systems: [],
		selectedSystem: null
	},
	validations: {
		username: {
			required
		},
		password: {
			required
		},
		captcha: {
			required
		}
	}, 
	beforeCreate: function(){
		if(self != top){
			top.location.href = self.location.href;
		}
	},
	methods: {
		refreshCode: function(){
			this.src = "captcha.jpg?t=" + $.now();
		},
		login: function (event) {
			var flag = true;
			var errMsg = "";
			if (!vm.$v.username.required) {
				errMsg = errMsg + "用户名 "
				flag = false;
			}
			if (!vm.$v.password.required) {
				errMsg = errMsg + "密码 "
				flag = false;
			}
			if (!vm.$v.captcha.required) {
				errMsg = errMsg + "验证码 ";
				flag = false;
			}
			if (!flag) {
				errMsg = errMsg + "不能为空";
				vm.errorMsg = errMsg;
				vm.error = true;
				return;
			}
			var data = "username="+vm.username+"&password="+vm.password+"&captcha="+vm.captcha;
			$.ajax({
				type: "POST",
			    url: "sys/login",
			    data: data,
			    dataType: "json",
			    success: function(result){
					if(result.code == 200){//登录成功，选择业务系统
						vm.systems = result.data;
						vm.errorMsg = "";
						vm.error = false;
						vm.showLogin = false;
					}else{
						vm.error = true;
						vm.errorMsg = result.msg;
						vm.captcha = "";
						vm.refreshCode();
					}
				}
			});
		},
		selectSys: function() {
			if (!vm.selectedSystem.id) {
				layer.alert("请选择业务系统");
			} else {
				$.ajax({
					type: "GET",
				    url: "setSystem?systemId=" + vm.selectedSystem.id,
				    dataType: "json",
				    success: function(result){
				    	if (result.code == 200) {
				    		location.href = 'index.html';
				    	} else {
				    		layer.alert(result.msg);
				    	}
				    }
				});
			}
		},
		cancelSelect: function() {
			$.get("logout");
			vm.refreshCode();
			vm.captcha = "";
			vm.showLogin = true;
		}
	}
});
</script>
</body>
</html>
